<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral HD Stream Video Portal</title>

  <!-- Monetag Multitag JS Code -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="305518" async data-cfasync="false"></script>

  <!-- Open Graph & Twitter Cards with 500M Views -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🔥 500M Views">
  <meta name="twitter:description" content="▶ Tap any video to watch in HD">
  <meta name="twitter:image" content="https://i.postimg.cc/7YcxR3LH/IMG-20261008-160903.jpg">

  <meta property="og:title" content="🔥 500M Views">
  <meta property="og:description" content="▶ Tap any video to watch in HD">
  <meta property="og:image" content="https://i.postimg.cc/7YcxR3LH/IMG-20261008-160903.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #121212;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      padding-bottom: 60px;
    }

    /* Top Ad Banner */
    .promo-banner {
      background: linear-gradient(90deg, #4b1248, #f0c27b);
      color: #fff;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      cursor: pointer;
    }
    .promo-btn {
      background: #ffcc00;
      color: #000;
      border: none;
      padding: 5px 10px;
      font-weight: bold;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Main Video Player Wrapper */
    .main-player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .main-player-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Transparent Clickable Overlays */
    .fake-overlay {
      position: absolute;
      cursor: pointer;
      z-index: 20;
    }
    .overlay-sound { bottom: 0; left: 0; width: 30%; height: 25%; }
    .overlay-settings { top: 0; right: 0; width: 20%; height: 25%; }
    .overlay-fullscreen { bottom: 0; right: 0; width: 25%; height: 25%; }
    .overlay-center { top: 20%; left: 20%; width: 60%; height: 55%; }

    /* Video ke theek neeche Ad Banner */
    .video-bottom-ad {
      background: linear-gradient(135deg, #1f1f1f, #2d2d2d);
      border: 1px solid #444;
      padding: 12px 15px;
      margin: 8px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .ad-left-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .ad-tag {
      font-size: 10px;
      background: #ff0055;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      width: fit-content;
    }
    .ad-title {
      font-size: 13px;
      font-weight: bold;
      color: #ffcc00;
    }
    .ad-action-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 7px 14px;
      font-weight: bold;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Pagination Section */
    .pagination-container {
      background: #181818;
      padding: 20px 10px;
      text-align: center;
      border-top: 1px solid #2a2a2a;
      margin-top: 20px;
    }

    .next-page-btn {
      display: block;
      width: 100%;
      background: #ff334b;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(255, 51, 75, 0.4);
    }

    .page-numbers-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-box {
      background: #2b2b2b;
      color: #ccc;
      min-width: 38px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #383838;
    }

    .page-box.active {
      background: #222;
      color: #fff;
      border-color: #555;
    }

    .page-dots {
      color: #888;
      font-size: 16px;
      padding: 0 4px;
    }

    /* Footer Credits */
    .footer-credits {
      text-align: center;
      padding: 15px;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #222;
      background: #0a0a0a;
    }

    /* Fixed Sticky Bottom Ad Bar */
    .sticky-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffcc00;
      color: #000;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      z-index: 100;
      cursor: pointer;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.5);
    }
    .sticky-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Top Ad Banner -->
  <div class="promo-banner" onclick="handleRedirect(event)">
    <span>🎃 LIMITED OFFER - 50% OFF!</span>
    <button class="promo-btn">JOIN NOW</button>
  </div>

  <!-- Main Video Player -->
  <div class="main-player-wrapper" id="mainPlayer">
    <video id="mainVideoPlayer" controls autoplay muted playsinline preload="auto">
      <source id="mainVideoSource" src="https://files.catbox.moe/j0hym0.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- Transparent Overlays -->
    <div class="fake-overlay overlay-sound" onclick="handleRedirect(event)"></div>
    <div class="fake-overlay overlay-settings" onclick="handleRedirect(event)"></div>
    <div class="fake-overlay overlay-fullscreen" onclick="handleRedirect(event)"></div>
    <div class="fake-overlay overlay-center" onclick="handleRedirect(event)"></div>
  </div>

  <!-- Video ke theek neeche Ad Banner -->
  <div class="video-bottom-ad" onclick="handleRedirect(event)">
    <div class="ad-left-info">
      <span class="ad-tag">SPONSORED</span>
      <span class="ad-title">Watch Full HD Video Without Ads & Lag</span>
    </div>
    <button class="ad-action-btn">CLICK HERE</button>
  </div>

  <!-- Pagination Section -->
  <div class="pagination-container">
    <button class="next-page-btn" onclick="handleRedirect(event)">Next page &gt;</button>
    <div class="page-numbers-wrapper">
      <div class="page-box active" onclick="handleRedirect(event)">1</div>
      <div class="page-box" onclick="handleRedirect(event)">2</div>
      <div class="page-box" onclick="handleRedirect(event)">3</div>
      <div class="page-box" onclick="handleRedirect(event)">4</div>
      <div class="page-box" onclick="handleRedirect(event)">5</div>
      <div class="page-box" onclick="handleRedirect(event)">6</div>
      <span class="page-dots">...</span>
      <div class="page-box" onclick="handleRedirect(event)">971</div>
      <span class="page-dots">...</span>
      <div class="page-box" onclick="handleRedirect(event)">1941</div>
    </div>
  </div>

  <div class="footer-credits">
    <p>© 2026 StreamPortal HD. Ultra Fast Cloud Streaming.</p>
    <p style="margin-top:4px; color:#444;">Privacy Policy • Terms • 18+ Only</p>
  </div>

  <!-- Sticky Bottom Floating Bar -->
  <div class="sticky-bottom-bar" onclick="handleRedirect(event)">
    <span>⚡ WATCH IN FULL 1080P HD</span>
    <button class="sticky-btn">DOWNLOAD NOW</button>
  </div>

  <script>
    var targetUrl = "https://hai8g.com/4/12148131";
    var adOpened = false;

    function handleRedirect(event) {
      event.stopPropagation();
      window.location.href = targetUrl;
    }

    function handleFirstTouch(event) {
      if (!adOpened) {
        adOpened = true;
        let popup = window.open(targetUrl, '_blank');
        if (popup) {
          window.focus();
        }
      }
    }

    document.getElementById('mainVideoPlayer').addEventListener('play', function(event) {
      handleFirstTouch(event);
    });
  </script>
</body>
</html>
